name: Build and publish Pages

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - 'claude/knights-gauntlet-idle-rpg-0aiorv'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Show dist contents
        run: |
          if [ -d "dist" ]; then ls -la dist || true; else echo "dist not found"; fi

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
