name: Build and publish Pages

permissions:
  contents: write
  pages: write
  id-token: write

# Publishes from the repository's default branch plus whichever branch is under active
# development.
#
# `claude/knights-gauntlet-idle-rpg-0aiorv` is this repo's default branch — it is not a stale
# feature branch, despite the name, and pull requests target it. It was previously the *only*
# entry here, which meant an entire session of work on a development branch pushed cleanly and
# built nothing: the workflow simply never ran, so no failure was reported anywhere and the live
# site silently stayed on the default branch's last commit.
#
# When adding a development branch, add it — never swap it for the default branch, or the deploy
# breaks again the moment the pull request merges. Remove the development entry once merged.
on:
  push:
    branches:
      - 'claude/knights-gauntlet-idle-rpg-0aiorv'
      - 'claude/game-improvement-plan-a3e41j'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail the deploy on a broken build rather than publishing a stale artifact: lint and the
      # engine test suite (including the balanceSim survival floor) gate the production build.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build production
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
