name: Build and publish Pages

permissions:
  contents: write
  pages: write
  id-token: write

# Publishes from the default branch plus whichever `claude/*` branch is currently being
# developed on. The branch list was previously pinned to a single feature branch that has since
# been superseded, so an entire session's worth of pushes built nothing and the live site silently
# stayed on the last commit of the dead branch. Keep this list in step with the active branch, and
# drop branches once their pull request merges so a stale one cannot overwrite production.
on:
  push:
    branches:
      - main
      - 'claude/game-improvement-plan-a3e41j'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail the deploy on a broken build rather than publishing a stale artifact: lint and the
      # engine test suite (including the balanceSim survival floor) gate the production build.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build production
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
