name: Build and publish Pages

on:
  push:
    branches:
      - 'claude/knights-gauntlet-idle-rpg-0aiorv' # change if your default branch differs
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages       # the branch the action will push to
          folder: dist           # the folder to publish
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
