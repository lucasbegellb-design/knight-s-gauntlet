name: Build and publish Pages

permissions:
  contents: read
  pages: write
  id-token: write

# Two triggers, two jobs, no maintained branch list.
#
# This used to be `on.push.branches` with an explicit allowlist, which is a trap: forgetting to add
# your development branch produced *no CI and no deploy, and no error anywhere* — every push
# succeeded, the workflow simply never ran, and the live site silently stayed on whatever the
# default branch last built. An entire session's work was lost to it. An allowlist that fails
# silently and has to be edited by hand for every new branch is the wrong shape, so it is gone.
#
# `pull_request` gives every PR real CI regardless of what its branch is called, and `push` to the
# default branch is what publishes. Nothing to remember, nothing to clean up after a merge.
on:
  pull_request:
  push:
    branches:
      - 'claude/knights-gauntlet-idle-rpg-0aiorv' # this repo's default branch, despite the name
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gate the artifact on a green build rather than publishing whatever compiles: lint and the
      # engine test suite (including the balanceSim survival floor) run before it is produced.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build production
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # Publishing is a push-to-default-branch event only. A pull request builds and tests, it does
    # not deploy — a branch under review has no business replacing the live site.
    #
    # (An earlier revision of this comment claimed the `github-pages` environment *forces* this by
    # holding non-default-branch deploys for an approval that never arrives. That was wrong, and
    # worth correcting rather than quietly deleting: the deployments were being created fine and
    # then hanging at `deployment_in_progress` because GitHub Pages had an open "Deployment Lag"
    # incident at the time. The gate below is a deliberate policy choice, not a workaround.)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Pages allows one deployment in flight per site, so overlapping publishes collide with
    # "Deployment request failed ... due to in progress deployment". Scoped to this job rather than
    # the whole workflow so a pull request's lint/test/build never queues behind a publish it isn't
    # going to perform. Queue rather than cancel, so the newest push is the one that ends up live.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
